<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git-Sim</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li class="logo">LOGO</li>
                <li class="brand">GIT-SIM</li>
                <li class="chapter">Chapter: Git Basics</li>

            </ul>
        </nav>


    </header>




    <main>
        <div class="panel left-panel">


            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span> bash</span>
            </div>

            <div class="terminal-content">

            </div>


            <div class="terminal-input-area">
                <span class="prompt"></span>
                <input type="text" id="command-input" autocomplete="off" autofocus>
            </div>





        </div>



        <div class="panel visual-panel">
            <div class="placeholder-text">
                [ Git Graph Rendering Area ]
            </div>

        </div>
        <div class="panel right-panel">


            <div class="theory-content">
                <h1>Understanding Git Status</h1>
                <p>When you type a command in the terminal on the left, this panel will explain the underlying theory,
                    while the
                    center panel maps out the commits visually.</p>
            </div>

        </div>

    </main>


    <script src="src/app.js"></script>
</body>

</html>
